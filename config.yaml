# League of Legends news bot (Hebrew posts). TARGET_CHANNEL_ID env var (or .env) overrides target_channel_id.

target_channel_id: ""      # set via TARGET_CHANNEL_ID secret / .env
lookback_hours: 2          # Google News is high-volume + fresh; small window avoids a first-run flood
seen_retention_days: 30

# AI post generation (needs GEMINI_API_KEY secret). Translates to Hebrew; falls back to title+link if off/failed.
ai:
  enabled: true
  model: gemini-flash-latest
  team: "League of Legends"
  hashtags: ["#LeagueOfLegends", "#LoL"]

telegram_channels: []

rss_feeds:
  # Google News aggregates all LoL sources, stays fresh, and isn't Cloudflare-blocked.
  - name: "Google News - LoL"
    url: 'https://news.google.com/rss/search?q=%22League+of+Legends%22&hl=en-US&gl=US&ceid=US:en'
    always_relevant: true          # query is LoL-specific; AI gate is the backstop

html_sources: []
wp_sources: []

keywords:
  - "League of Legends"

exclusions: []
